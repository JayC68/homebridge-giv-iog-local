name: Publish npm

on:
  push:
    tags:
      - 'v4.0.1'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Use validated npm
        run: |
          npm install --global npm@11.20.0
          test "$(npm --version)" = "11.20.0"

      - name: Verify release
        run: |
          test "$(node -p 'require("./package.json").version')" = "4.0.1"
          npm install --ignore-scripts --package-lock=false
          npm test
          npm run test:hap

      - name: Build and verify reviewed package
        run: |
          npm pack
          echo '16c41b777564b335ad75dc75bb1c3748294e5325cf2237e87734744f9fec50f0  homebridge-giv-iog-local-4.0.1.tgz' | sha256sum --check

      - name: Publish with trusted publishing
        run: npm publish homebridge-giv-iog-local-4.0.1.tgz --access public --tag latest
