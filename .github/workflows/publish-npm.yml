name: Publish npm

on:
  push:
    tags:
      - 'v4.0.2'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Use validated npm
        run: |
          npm install --global npm@11.20.0
          test "$(npm --version)" = "11.20.0"

      - name: Verify release
        run: |
          test "$(node -p 'require("./package.json").version')" = "4.0.2"
          npm install --ignore-scripts
          npm test
          npm run test:hap
          npm audit --audit-level=low

      - name: Build and verify reviewed package
        run: |
          npm pack
          echo '606e7153ae39e2c6b75446d23c9871862c8ba6180414f66d8d69db1440333574  homebridge-giv-iog-local-4.0.2.tgz' | sha256sum --check

      - name: Publish with trusted publishing
        run: npm publish homebridge-giv-iog-local-4.0.2.tgz --access public --tag latest
