name: Publish npm

on:
  push:
    tags:
      - 'v4.0.0'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Use validated npm
        run: |
          npm install --global npm@11.20.0
          test "$(npm --version)" = "11.20.0"

      - name: Verify release
        run: npm test

      - name: Publish with trusted publishing
        run: npm publish --access public --loglevel=silly
