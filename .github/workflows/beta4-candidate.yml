name: Beta.4 candidate validation

on:
  push:
    branches: ['release/v4.0.3-beta-4']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Isolated candidate checks
        run: |
          npm ci --ignore-scripts
          for file in index.js lib/*.js tools/*.js; do node --check "$file"; done
          npm test
          npm run test:hap
          npm audit --audit-level=low
          npm pack
      - name: Check opt-in beta publication approval
        run: node tools/verify-observation-qualification.js --beta-publication
      - name: Accelerated observation smoke
        run: node --expose-gc tools/solar-observation-stress.js --days=2
